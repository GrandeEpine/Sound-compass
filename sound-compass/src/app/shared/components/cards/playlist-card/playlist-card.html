<a
  [href]="playlist().external_urls.spotify"
  target="_blank"
  rel="noopener noreferrer"
  class="group flex flex-col bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100
         hover:shadow-md hover:-translate-y-1 transition-all duration-200 cursor-pointer h-full"
>
  <div class="aspect-square w-full overflow-hidden bg-blue-50">
    @if (playlist().images?.[0]?.url) {
      <img
        [src]="playlist().images[0].url"
        [alt]="playlist().name | decodeHtml"
        class=" object-cover h-full group-hover:scale-105 transition-transform duration-300"
        loading="lazy"
      />
    } @else {
      <div class="w-full h-full flex items-center justify-center bg-blue-100">
        <svg viewBox="0 0 24 24" class="w-12 h-12 text-blue-400" fill="currentColor">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
      </div>
    }
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-1 p-4 flex-1">
    <h3 class="font-semibold text-gray-900 text-sm leading-tight line-clamp-2 group-hover:text-blue-600 transition-colors">
      {{ playlist().name | decodeHtml }}
    </h3>

    @if (playlist().description) {
      <p class="text-gray-400 text-xs leading-relaxed line-clamp-2 mt-1">
        {{ playlist().description | decodeHtml }}
      </p>
    }
  </div>
</a>
