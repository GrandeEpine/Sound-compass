<li
  class="rounded-2xl cursor-pointer py-3 px-8 text-center m-1"
  [class.bg-green-400]="isSelected()"
  [class.bg-blue-400]="!isSelected()"
  [class.hover:bg-blue-500]="!isSelected()"
  [class.hover:bg-green-500]="isSelected()"
  (click)="toggleSelection()"
>
  <h3>{{ genre().getName() }}</h3>
</li>
