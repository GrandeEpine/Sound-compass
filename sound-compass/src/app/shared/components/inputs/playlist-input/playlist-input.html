<!-- step-input.html -->
<div class="flex flex-row gap-3 w-full mb-5 mt-5">
  <input
    #urlInput
    type="url"
    [value]="url()"
    (input)="url.set(urlInput.value)"
    (keydown.enter)="validate()"
    placeholder="https://open.spotify.com/playlist/..."
    class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none
           focus:ring-2 focus:ring-blue-500 text-sm"
    [class.border-red-400]="error()"
  />

  <app-validate-button
    (action)="validate()"
    [disabled]="this.error() !== null"
  />
</div>

@if (error()) {
  <p class="text-red-500 text-xs mt-2">{{ error() }}</p>
}
