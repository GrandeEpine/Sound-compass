<div class="w-full">
  @if (userServices.isLoading()) {
    <!-- Loading view  -->
    <div class="w-full min-h-screen flex items-center justify-center bg-gradient-to-b from-blue-50 to-white">
      <app-loading />
    </div>

  } @else if (!this.userServices.userProfile()) {
      <!-- Guest view  -->
      <app-home-guest></app-home-guest>
  } @else {
    <!-- User view  -->
    <app-home-authenticated></app-home-authenticated>
  }
</div>
