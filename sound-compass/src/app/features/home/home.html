<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sound Compass Home</title>
  </head>
  <body class="w-full">
    <div class="w-max h-full backdrop-grayscale-0">
      <div>
        @if (!this.userServices.userProfile()) {
          <h1 class="">Welcome to Sound Compass</h1>
          <h2>Login with your Spotify account to start</h2>
        } @else {
          <h2>Welcome back, {{ this.userServices.userProfile()?.name }} !</h2>
        }
      </div>
    </div>
  </body>
</html>
