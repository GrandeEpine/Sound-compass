<div class="flex flex-col items-center w-full">
  <div class="w-full px-4">
    <app-playlist-input (next)="onPlaylistIdReceived($event)"></app-playlist-input>
  </div>
  @if (isLoading()) {
    <app-loading />
  } @else if (playlist()) {
    <div class="w-1/4 flex items-center justify-center">
      <app-playlist-card [playlist]="playlist()!" />
    </div>

    <button class="bg-blue-500 hover:bg-blue-600 disabled:opacity-40 disabled:cursor-not-allowed
           text-white font-semibold py-2 px-6 rounded-lg transition-colors self-start mt-5 mb-5"
            (click)="confirm()">Utiliser cette playlist →</button>
  } @else {
    <p class="text-gray-500">Aucune playlist trouvée.</p>
  }
</div>
