@if (isLoading()) {
  <h3 class="text-3xl font-semibold text-blue-600 text-center mb-10">
    {{ this.status() }}
  </h3>

  <app-loading class="mb-10 mt-10"/>
} @else {
  <div class="flex w-full items-center gap-2 justify-center">
    <app-playlist-genres-search
      class="w-4/5"
      [genreList]="calculatedGenres()"
      (foundGenres)="onGenresFiltered($event)"
    />

    <button
      class="flex-none flex items-center justify-center w-10 h-10 rounded-2xl border-2 border-b-black m-2"
      [class.bg-blue-400]="!isAllSelected()"
      [class.bg-green-400]="isAllSelected()"
      (click)="selectAll()"
    >
      <img
        src="/selectAllIcon.png"
        alt="Select All"
        class="block w-6 h-6 object-contain"
      />
    </button>

    <button
      class="flex-none flex items-center justify-center w-10 h-10 rounded-2xl border-2 border-b-black m-2"
      [class.bg-blue-400]="!isAlphabeticalSelected()"
      [class.bg-green-400]="isAlphabeticalSelected()"
      (click)="alphabeticalSort()"
    >
      <img
        src="/alphabetical.png"
        alt="Sort Alphabetically"
        class="block w-6 h-6 object-contain"
      />
    </button>
  </div>


  <ul class="flex flex-wrap justify-around gap-y-4 w-full mb-4 mt-4">
    @for (genre of displayedGenres(); track genre.getName()) {
      <app-genre-card
        [genre]="genre"
        [isSelected]="isGenreSelected(genre)"
        (toggled)="toggleGenre($event)"
      />
    }
  </ul>
  <div class="w-full mt-8 " >
    <app-validate-button
      (action)="confirm()"
      [disabled]="selectedGenreNames().size === 0"
      class="flex justify-end"
    />
  </div>

}
