
<h2 class="text-2xl md:text-3xl mt-4 font-bold text-gray-900 mb-4">{{this.status()}}</h2>
@if (isLoading()){
  <app-loading />
} @else if (playlistEmbedUrl()) {
  <div class="mb-6 mt-6">
    <iframe
      [src]="playlistEmbedUrl()"
      width="100%"
      height="600"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
    <div class="w-full">
      <app-delete-button [playlistId]="this.newPlaylistId() ?? '' "
      class="flex justify-end"
      />
    </div>

  </div>

}
