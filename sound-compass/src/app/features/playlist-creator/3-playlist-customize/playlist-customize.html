<div class="m-4" >
  <div class="mb-4">
    <h3>Playlist name:</h3>
    <input
      #inputElement
      type="text"
      [value]="playlistName()"
      (input)="playlistName.set($any($event.target).value)"
      placeholder=""
      class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none
           focus:ring-2 focus:ring-blue-500 text-sm w-full"
    />
  </div>

  <div class="mb-4">
    <h3>Playlist description:</h3>
    <input
      #inputElement
      type="text"
      [value]="playlistDescription()"
      (input)="playlistDescription.set($any($event.target).value)"
      placeholder=""
      class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none
           focus:ring-2 focus:ring-blue-500 text-sm w-full"
    />
  </div>

  <app-validate-button
    (action)="confirm()"
    [disabled]="playlistName() === ''"
  />
</div>
