<div class="m-4" >
  <div class="mb-4">
    <h3>Playlist name:</h3>
    <input
      #inputElement
      type="text"
      [value]="playlistName()"
      (input)="playlistName.set($any($event.target).value)"
      placeholder=""
      class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none
           focus:ring-2 focus:ring-blue-500 text-sm w-full"
    />
  </div>

  <div class="mb-4">
    <h3>Playlist description:</h3>
    <input
      #inputElement
      type="text"
      [value]="playlistDescription()"
      (input)="playlistDescription.set($any($event.target).value)"
      placeholder=""
      class="flex-1 px-4 py-3 rounded-lg border border-gray-200 focus:outline-none
           focus:ring-2 focus:ring-blue-500 text-sm w-full"
    />
  </div>
  <div class="mb-4">
    <h3>Privacy:</h3>

    <label class="inline-flex items-center mr-4">
      <input
        type="radio"
        name="privacy"
        [checked]="!isPrivate()"
        (change)="isPrivate.set(false)"
        class="mr-2"
      />
      Public
    </label>

    <label class="inline-flex items-center">
      <input
        type="radio"
        name="privacy"
        [checked]="isPrivate()"
        (change)="isPrivate.set(true)"
        class="mr-2"
      />
      Private
    </label>
  </div>

  <app-validate-button
    (action)="confirm()"
    [disabled]="playlistName() === ''"
  />
</div>
